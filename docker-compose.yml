version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orientame-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    depends_on:
      - db
      - redis
    networks:
      - orientame

  nginx:
    image: nginx:alpine
    container_name: orientame-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - orientame

  db:
    image: mysql:8.0
    container_name: orientame-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: orientame
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: orientame
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - orientame

  redis:
    image: redis:alpine
    container_name: orientame-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - orientame

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orientame-queue
    restart: unless-stopped
    command: php artisan queue:work
    volumes:
      - .:/var/www
    depends_on:
      - db
      - redis
    networks:
      - orientame

networks:
  orientame:
    driver: bridge

volumes:
  dbdata:
  redisdata: